name: DCO

# Every commit in a pull request must carry a `Signed-off-by:` trailer matching its author.
# That trailer is the contributor certifying they have the right to submit the code under the
# project's licence (the Developer Certificate of Origin, https://developercertificate.org).
# It is not a copyright assignment and grants the maintainers nothing beyond the inbound licence —
# it just means the provenance of every commit is recorded rather than assumed.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole PR range, plus its base, so every commit can be inspected.
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          # `%(trailers:key=Signed-off-by,valueonly)` reads the trailer properly rather than
          # grepping the body, so a mention of the phrase in prose cannot pass for a sign-off.
          while read -r sha; do
            [ -z "${sha}" ] && continue
            author="$(git show -s --format='%ae' "${sha}")"
            signoffs="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "${sha}")"
            if [ -z "${signoffs}" ]; then
              echo "✗ ${sha} $(git show -s --format='%s' "${sha}")"
              echo "    no Signed-off-by trailer"
              failed=1
              continue
            fi
            if ! printf '%s\n' "${signoffs}" | grep -qiF "<${author}>"; then
              echo "✗ ${sha} $(git show -s --format='%s' "${sha}")"
              echo "    signed off, but not by the commit author (${author})"
              failed=1
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [ "${failed}" -ne 0 ]; then
            cat >&2 <<'MSG'

          One or more commits are missing a Developer Certificate of Origin sign-off.

          Add it to new commits with:
              git commit -s

          To fix commits you have already made:
              git rebase --signoff origin/main
              git push --force-with-lease

          Full text: https://developercertificate.org
          MSG
            exit 1
          fi
          echo "✓ every commit is signed off by its author"
