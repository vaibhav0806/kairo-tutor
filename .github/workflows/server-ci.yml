name: server-ci

# Verify the backend on every change to server/. Tests use an isolated local Postgres service;
# no repository secrets, Neon branch, or external provider credentials are available to the job.
# DEPLOY is intentionally NOT here — it stays manual + user-confirmed (server/AGENTS.md).
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/server-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kairo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kairo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install workspace
        run: npm ci
      - name: Typecheck (server)
        run: npm run typecheck -w @kairo/server
      - name: Build (server)
        run: npm run build -w @kairo/server
      - name: Test (server)
        run: npm run test -w @kairo/server
