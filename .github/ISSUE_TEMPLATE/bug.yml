name: Bug report
description: Report a reproducible problem with Kairo Tutor
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, private user data, screenshots containing sensitive information, or undisclosed security vulnerabilities.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability. I will report security issues privately using SECURITY.md.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: A clear, concise description of the bug and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Kairo Tutor...
        2. Perform...
        3. Observe...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - Server/API
        - Build or contributor tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kairo Tutor version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: For desktop bugs, include the macOS version and hardware. For other components, include the relevant OS and runtime versions.
      placeholder: macOS 15.5 on Apple M2, or Ubuntu 24.04 with Node 22
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend target
      options:
        - Hosted
        - Local
        - Not sure
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      description: Remove tokens, personal data, transcripts, questions, answers, and other sensitive content before pasting logs.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other non-sensitive information that may help diagnose the issue.
