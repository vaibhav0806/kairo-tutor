name: Feature request
description: Suggest an improvement to Kairo Tutor
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Explain the user problem before proposing an implementation.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate request.
          required: true
        - label: I reviewed the current product scope in FEATURE.md.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what are they trying to accomplish?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation details.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.

  - type: textarea
    id: privacy
    attributes:
      label: Privacy and external services
      description: Would this change capture, store, or send any screen, audio, transcript, account, or billing data? If so, explain what and why.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups or other non-sensitive context if useful.
