# Kairo backend deploy (Hetzner). Joins the existing `tech-digest-net` so the shared
# Caddy on that box can `reverse_proxy kairo-server:8787`. Publishes NO host ports —
# 80/443 belong to that Caddy. Secrets live in ./.env (gitignored, created on the box).
services:
  kairo-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: kairo-server:latest
    container_name: kairo-server
    restart: unless-stopped
    env_file: .env
    environment:
      # Non-secret selector. Runtime + migration guards verify the live Dodo mode and exact
      # production Neon endpoint before serving or changing data.
      KAIRO_SERVER_TARGET: hosted
      # Release DMGs, mounted read-only. They are served through the email-gated download route
      # rather than from a public URL, which is what keeps the alpha closed.
      KAIRO_RELEASES_DIR: /srv/kairo-releases
    volumes:
      # Host path is user-owned (no sudo in the release script); container path is fixed.
      - ${KAIRO_RELEASE_DIR:?Set KAIRO_RELEASE_DIR to the host release directory}:/srv/kairo-releases:ro
    # Cap container logs (shared box) — 3 x 10MB rolling, never fills the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tech-digest-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  tech-digest-net:
    external: true
