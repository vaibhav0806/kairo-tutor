<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kairo — UI/UX library explorer</title>

<style>
/* ---------------------------------------------------------------------------
   Fonts — loaded straight out of the repo's node_modules so this file works
   offline. (Same families the landing page + the app use.)
   --------------------------------------------------------------------------- */
@font-face{font-family:"Geist Variable";font-style:normal;font-display:swap;font-weight:100 900;
  src:url("/Users/prasad/Prasad/projects/kairo-tutor/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2-variations");}
@font-face{font-family:"Bricolage Grotesque Variable";font-style:normal;font-display:swap;font-weight:200 800;
  src:url("/Users/prasad/Prasad/projects/kairo-tutor/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2") format("woff2-variations");}
@font-face{font-family:"Geist Mono Variable";font-style:normal;font-display:swap;font-weight:100 900;
  src:url("/Users/prasad/Prasad/projects/kairo-tutor/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2-variations");}

/* ---------------------------------------------------------------------------
   Tokens — copied verbatim from src/styles.css (which mirrors the website).
   --------------------------------------------------------------------------- */
:root{
  --canvas:#f5f7fb; --canvas-raised:#fbfcfe; --canvas-soft:#f8f9fb;
  --surface-soft:#e9edf5; --surface-deep:#141824;
  --ink:#0b0d12; --ink-strong:#08090c; --ink-muted:#626a78; --ink-subtle:#505765;
  --hairline:rgb(11 13 18 / 10%);
  --kairo:#665cff; --kairo-rgb:102 92 255;
  --verify:#b8f34a; --react:#ff6b66; --notice:#ffd84d;
  --font-body:"Geist Variable",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-display:"Bricolage Grotesque Variable",var(--font-body);
  --font-mono:"Geist Mono Variable",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius-button:3px; --radius-card:14px; --radius-inset:8px;
  --shadow-offset:6px 6px 0 rgb(102 92 255 / 19%);
  /* live-themeable accent for every demo (mirrors the app's user accent) */
  --acc:#665cff; --acc-rgb:102 92 255;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;font-synthesis:none}
::selection{background:var(--kairo);color:#fff}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-0.045em;color:var(--ink-strong);margin:0}
a{color:var(--kairo)}
.mono{font-family:var(--font-mono)}
code{font-family:var(--font-mono);font-size:.9em;background:var(--surface-soft);padding:1px 4px;border-radius:3px}

/* ---- chrome ---- */
.hd{position:sticky;top:0;z-index:50;background:rgb(245 247 251 / 0.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hairline)}
.hd-in{max-width:1440px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:740;font-size:19px;letter-spacing:-0.065em;text-transform:lowercase}
.brand small{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-muted);margin-left:9px;letter-spacing:.14em}
.hd-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.acc-dots{display:flex;gap:6px}
.acc-dot{width:19px;height:19px;border-radius:999px;border:0;cursor:pointer;box-shadow:0 0 0 1px var(--hairline)}
.acc-dot[data-on="1"]{box-shadow:0 0 0 2px var(--canvas),0 0 0 4px var(--ink)}
.srch{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--hairline);border-radius:var(--radius-inset);
  background:var(--canvas-raised);outline:none;width:210px}
.srch:focus{border-color:rgb(var(--acc-rgb) / .55)}

.wrap{max-width:1440px;margin:0 auto;padding:26px 22px 120px;display:grid;grid-template-columns:214px 1fr;gap:34px}
nav.toc{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;
  font-size:12.5px;display:flex;flex-direction:column;gap:1px;padding-right:6px}
nav.toc a{display:block;padding:5px 9px;border-radius:6px;color:var(--ink-subtle);text-decoration:none}
nav.toc a:hover{background:var(--surface-soft);color:var(--ink)}
nav.toc a.on{background:rgb(var(--acc-rgb) / .1);color:var(--ink-strong);font-weight:600}
nav.toc .toc-h{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-muted);padding:14px 9px 4px}

.intro{border:1px solid var(--hairline);border-radius:var(--radius-card);background:var(--canvas-raised);
  padding:26px 28px;box-shadow:var(--shadow-offset);margin-bottom:40px}
.intro h1{font-size:40px;line-height:.94;font-weight:670;letter-spacing:-0.055em}
.intro p{color:var(--ink-subtle);line-height:1.6;font-size:14.5px;max-width:78ch}
.kick{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ---- sections ---- */
.sec{margin:0 0 62px;scroll-margin-top:78px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.sec-h h2{font-size:27px;font-weight:670}
.sec-blurb{color:var(--ink-muted);font-size:13.5px;line-height:1.6;max-width:86ch;margin:6px 0 18px}
.today{border:1px solid var(--hairline);border-left:3px solid var(--ink-strong);border-radius:var(--radius-inset);
  background:var(--canvas-raised);padding:14px 16px;margin-bottom:20px;display:grid;
  grid-template-columns:minmax(220px,340px) 1fr;gap:18px;align-items:center}
.today .t-meta h4{font-size:15px;margin-bottom:4px}
.today .t-pain{font-size:12.5px;color:var(--ink-muted);line-height:1.55}
.today .t-pain b{color:#9f2d24;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(298px,1fr));gap:16px}
.opt{border:1px solid var(--hairline);border-radius:var(--radius-card);background:var(--canvas-raised);
  padding:13px 14px 14px;display:flex;flex-direction:column;transition:box-shadow .18s,transform .18s}
.opt:hover{box-shadow:5px 5px 0 rgb(var(--acc-rgb) / .13)}
.opt-h{display:flex;align-items:flex-start;gap:8px;margin-bottom:2px}
.opt-h h4{font-size:14.5px;font-weight:670;letter-spacing:-0.03em;line-height:1.2}
.lib{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted);margin-bottom:9px;word-break:break-all}
.why{font-size:12.5px;color:var(--ink-subtle);line-height:1.5;margin-top:auto}
.why b{color:var(--ink)}
.badge{font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 6px;border-radius:3px;border:1px solid var(--hairline);white-space:nowrap;color:var(--ink-muted);
  background:var(--surface-soft);flex:none;margin-left:auto}
.badge.live{background:color-mix(in srgb,var(--verify) 30%,#fff);border-color:color-mix(in srgb,var(--verify) 55%,var(--hairline));color:#4a6f08}
.badge.mock{background:color-mix(in srgb,var(--notice) 26%,#fff);border-color:color-mix(in srgb,var(--notice) 50%,var(--hairline));color:#6b4c00}
.badge.cur{background:var(--ink-strong);border-color:var(--ink-strong);color:#fff}
.badge.pick{background:rgb(var(--acc-rgb) / .14);border-color:rgb(var(--acc-rgb) / .4);color:color-mix(in srgb,var(--acc) 62%,var(--ink))}
.badge.warn{background:color-mix(in srgb,var(--react) 22%,#fff);border-color:color-mix(in srgb,var(--react) 46%,var(--hairline));color:#8d2b26}
.demo{border:1px dashed var(--hairline);border-radius:var(--radius-inset);background:var(--canvas-soft);
  min-height:104px;display:flex;align-items:center;justify-content:center;padding:16px;margin:2px 0 11px;
  position:relative;overflow:hidden}
.demo.dark{background:linear-gradient(180deg,#1b1d23,#101216);border:1px solid rgb(255 255 255 / .08);color:#eef1f5}
.demo.desk{background:
  radial-gradient(120% 90% at 50% 0%,rgb(var(--acc-rgb) / .10),transparent 60%),
  linear-gradient(180deg,#20232c,#0d0f14);border-color:rgb(255 255 255 / .07);color:#eef1f5}
.demo.tall{min-height:168px}
.demo.stack{flex-direction:column;gap:10px}
.inst{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-subtle);background:var(--surface-soft);
  border-radius:4px;padding:4px 7px;margin-top:9px;cursor:copy;border:1px solid transparent;word-break:break-all}
.inst:hover{border-color:var(--hairline)}
.inst.copied{background:color-mix(in srgb,var(--verify) 30%,#fff)}
.note{font-size:12px;color:var(--ink-muted);line-height:1.55;background:var(--canvas-soft);border:1px solid var(--hairline);
  border-radius:var(--radius-inset);padding:11px 13px;margin:14px 0 18px}
.note b{color:var(--ink)}
.hidden{display:none !important}

/* ---- audit list ---- */
.audit{display:grid;gap:10px}
.aud{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:start;padding:12px 14px;
  border:1px solid var(--hairline);border-radius:var(--radius-inset);background:var(--canvas-raised)}
.aud .n{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);padding-top:2px}
.aud h4{font-size:14px;margin-bottom:3px}
.aud p{margin:0;font-size:12.5px;color:var(--ink-muted);line-height:1.55}
.sev{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:3px}
.sev.hi{background:color-mix(in srgb,var(--react) 22%,#fff);color:#8d2b26}
.sev.md{background:color-mix(in srgb,var(--notice) 30%,#fff);color:#6b4c00}
.sev.lo{background:var(--surface-soft);color:var(--ink-muted)}

/* =====================================================================
   DEMO COMPONENT STYLES
   ===================================================================== */

/* -- generic scaffolding used by many demos -- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:12.5px;color:var(--ink-subtle)}
.dark .lbl{color:rgb(238 241 245 / .7)}

/* ---------- buttons ---------- */
.b{cursor:pointer;font:inherit;font-size:13.5px;font-weight:640;border:1px solid transparent;padding:9px 16px;
  border-radius:6px;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,background .16s,filter .16s}
.b-kairo{background:var(--ink-strong);border-color:var(--ink-strong);color:#fff;border-radius:var(--radius-button);
  box-shadow:5px 5px 0 rgb(var(--acc-rgb) / .19)}
.b-kairo:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 rgb(var(--acc-rgb) / .26)}
.b-kairo:active{transform:translate(4px,4px);box-shadow:1px 1px 0 rgb(var(--acc-rgb) / .3)}
.b-shad{background:var(--ink-strong);color:#fff;border-radius:6px;font-weight:560;font-size:13px;padding:8px 15px;
  box-shadow:0 1px 2px rgb(0 0 0 / .07)}
.b-shad:hover{background:#22252d}
.b-shad-out{background:transparent;color:var(--ink);border-color:var(--hairline);border-radius:6px;font-weight:560;font-size:13px;padding:8px 15px}
.b-shad-out:hover{background:var(--surface-soft)}
.b-radix{background:var(--acc);color:#fff;border-radius:4px;font-weight:560;letter-spacing:.005em}
.b-radix:hover{filter:brightness(1.08)}
.b-radix-soft{background:rgb(var(--acc-rgb) / .13);color:color-mix(in srgb,var(--acc) 62%,var(--ink));border-radius:4px;font-weight:560}
.b-mantine{background:var(--acc);color:#fff;border-radius:4px;font-weight:600;font-size:13px;padding:8px 17px}
.b-mantine:hover{filter:brightness(.93)}
.b-mantine-grad{background:linear-gradient(45deg,var(--acc),#c05cff);color:#fff;border-radius:999px;font-weight:600}
.b-hero{background:var(--acc);color:#fff;border-radius:12px;font-weight:600;padding:10px 18px;
  box-shadow:0 8px 18px -8px rgb(var(--acc-rgb) / .8)}
.b-hero:active{transform:scale(.97)}
.b-geist{background:#000;color:#fff;border-radius:6px;font-weight:520;font-size:13px;padding:8px 15px;border-color:#000}
.b-geist:hover{background:#fff;color:#000;border-color:var(--hairline)}
.b-linear{color:#fff;border-radius:8px;font-weight:560;font-size:13px;padding:8px 15px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 88%,#fff),var(--acc));
  border-color:color-mix(in srgb,var(--acc) 70%,#000);
  box-shadow:inset 0 1px 0 rgb(255 255 255 / .28),0 1px 2px rgb(0 0 0 / .18)}
.b-linear:hover{filter:brightness(1.06)}
.b-mac{background:linear-gradient(180deg,#5aa2ff,#0a72f5);color:#fff;border-radius:7px;font-size:13px;font-weight:520;
  padding:6px 15px;border-color:#0a66d8;box-shadow:0 1px 1px rgb(0 0 0 / .13),inset 0 1px 0 rgb(255 255 255 / .3)}
.b-mac:active{filter:brightness(.9)}
.b-mac:focus-visible{outline:3px solid rgb(10 114 245 / .35);outline-offset:1px}
.b-spring{background:var(--ink-strong);color:#fff;border-radius:9px;font-weight:600;transition:transform .12s}
.b-ghost{background:transparent;border-color:var(--hairline);color:var(--ink-subtle);font-size:12.5px;padding:7px 14px;border-radius:var(--radius-button)}
.b-ghost:hover{background:var(--surface-soft)}
/* shimmer border (Magic UI flavour) */
.b-shimmer{position:relative;background:var(--ink-strong);color:#fff;border-radius:8px;border:0;padding:10px 18px;
  isolation:isolate;overflow:hidden}
.b-shimmer::before{content:"";position:absolute;inset:-140%;z-index:-2;
  background:conic-gradient(from 0deg,transparent 0 300deg,var(--acc) 330deg,transparent 360deg);
  animation:spin 2.6s linear infinite}
.b-shimmer::after{content:"";position:absolute;inset:1.5px;z-index:-1;border-radius:6.5px;background:var(--ink-strong)}
@keyframes spin{to{transform:rotate(1turn)}}
/* moving border (Aceternity flavour) */
.b-moving{position:relative;background:var(--canvas-raised);color:var(--ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.b-moving::before{content:"";position:absolute;inset:0;border-radius:10px;padding:1.4px;
  background:conic-gradient(from var(--ang,0deg),transparent 0 70%,var(--acc) 85%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:ang 3s linear infinite}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ang{to{--ang:360deg}}
.b-magnet{background:var(--ink-strong);color:#fff;border-radius:999px;font-weight:600;padding:11px 20px;will-change:transform}
.b-gooey{background:var(--acc);color:#fff;border-radius:999px;font-weight:600;padding:10px 20px;position:relative;overflow:hidden}
.b-gooey span{position:relative;z-index:1}
.b-gooey::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),
  rgb(255 255 255 / .35) 0%,transparent 45%);opacity:0;transition:opacity .2s}
.b-gooey:hover::after{opacity:1}

/* ---------- switches ---------- */
.sw{appearance:none;border:0;cursor:pointer;position:relative;flex:none}
.sw-kairo{width:40px;height:24px;border-radius:999px;background:rgb(11 13 18 / .18);transition:background .16s}
.sw-kairo[data-on="1"]{background:var(--acc)}
.sw-kairo i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgb(11 13 18 / .25);transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.sw-kairo[data-on="1"] i{transform:translateX(16px)}
.sw-base{width:38px;height:22px;border-radius:999px;background:var(--surface-soft);box-shadow:inset 0 0 0 1px var(--hairline);
  transition:background .2s,box-shadow .2s}
.sw-base[data-on="1"]{background:var(--acc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 70%,#000)}
.sw-base i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.sw-base[data-on="1"] i{transform:translateX(16px)}
.sw-base:focus-visible{outline:2px solid rgb(var(--acc-rgb) / .55);outline-offset:2px}
.sw-mac{width:51px;height:31px;border-radius:999px;background:#e3e3e6;box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .08);
  transition:background .25s cubic-bezier(.2,.8,.2,1)}
.sw-mac[data-on="1"]{background:#34c759}
.sw-mac i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:999px;background:#fff;
  box-shadow:0 3px 8px rgb(0 0 0 / .16),0 1px 1px rgb(0 0 0 / .16);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),width .18s}
.sw-mac[data-on="1"] i{transform:translateX(20px)}
.sw-mac:active i{width:32px}
.sw-mac[data-on="1"]:active i{transform:translateX(15px)}
.sw-ios-acc[data-on="1"]{background:var(--acc)}
.sw-lin{width:32px;height:18px;border-radius:999px;background:rgb(11 13 18 / .14);transition:background .16s}
.sw-lin[data-on="1"]{background:var(--acc)}
.sw-lin i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;
  transition:transform .16s cubic-bezier(.34,1.4,.6,1)}
.sw-lin[data-on="1"] i{transform:translateX(14px)}
.sw-icon{width:52px;height:26px;border-radius:6px;background:var(--surface-soft);box-shadow:inset 0 0 0 1px var(--hairline)}
.sw-icon[data-on="1"]{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.sw-icon i{position:absolute;top:2px;left:2px;width:24px;height:22px;border-radius:4px;background:#fff;
  box-shadow:0 1px 2px rgb(0 0 0 / .18);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.sw-icon[data-on="1"] i{transform:translateX(24px)}
.sw-icon b{position:absolute;top:0;height:26px;display:flex;align-items:center;font-size:10px;font-family:var(--font-mono);
  color:var(--ink-muted)}
.sw-icon b.on{left:7px}.sw-icon b.off{right:7px}
.sw-txt{width:74px;height:28px;border-radius:999px;background:var(--surface-soft);box-shadow:inset 0 0 0 1px var(--hairline);
  font-family:var(--font-mono);font-size:10.5px}
.sw-txt i{position:absolute;top:3px;left:3px;width:36px;height:22px;border-radius:999px;background:var(--ink-strong);
  transition:transform .22s cubic-bezier(.34,1.3,.5,1)}
.sw-txt[data-on="1"] i{transform:translateX(32px);background:var(--acc)}
.sw-txt u{position:absolute;top:0;height:28px;display:flex;align-items:center;text-decoration:none;z-index:1;
  color:var(--ink-muted);transition:color .2s}
.sw-txt u.a{left:12px}.sw-txt u.b{right:11px}
.sw-txt[data-on="0"] u.a{color:#fff}.sw-txt[data-on="1"] u.b{color:#fff}
.sw-spring i{transition:transform .42s cubic-bezier(.34,1.56,.5,1)}

/* ---------- inputs / selects ---------- */
.inp{font:inherit;font-size:13.5px;padding:8px 12px;border-radius:var(--radius-inset);border:1px solid var(--hairline);
  background:var(--canvas-soft);outline:none;width:100%;color:var(--ink)}
.inp:focus{border-color:rgb(var(--acc-rgb) / .55)}
.pop{width:100%;max-width:250px;background:var(--canvas-raised);border:1px solid var(--hairline);border-radius:10px;
  box-shadow:0 12px 30px -12px rgb(11 13 18 / .35);overflow:hidden;font-size:13px}
.pop-i{padding:7px 11px;display:flex;align-items:center;gap:8px;cursor:pointer}
.pop-i:hover,.pop-i[data-sel="1"]{background:var(--surface-soft)}
.pop-i[aria-selected="true"]{background:rgb(var(--acc-rgb) / .1);color:color-mix(in srgb,var(--acc) 60%,var(--ink))}
.pop-i .ck{margin-left:auto;color:var(--acc);font-size:12px}
.pop-h{padding:6px 11px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-muted);background:var(--canvas-soft);border-bottom:1px solid var(--hairline)}
.pop-s{padding:7px 11px;border-bottom:1px solid var(--hairline);display:flex;gap:7px;align-items:center}
.pop-s input{border:0;background:transparent;outline:none;font:inherit;font-size:13px;width:100%}
.pop-list{max-height:132px;overflow:auto}
.play{width:22px;height:22px;border-radius:999px;border:1px solid var(--hairline);background:var(--canvas-raised);
  display:grid;place-items:center;cursor:pointer;font-size:9px;color:var(--ink-subtle);flex:none}
.play:hover{border-color:rgb(var(--acc-rgb) / .5);color:var(--acc)}
.mini-wave{display:flex;align-items:center;gap:2px;height:14px}
.mini-wave i{width:2px;border-radius:2px;background:rgb(var(--acc-rgb) / .55);height:5px;animation:mw 1s ease-in-out infinite}
@keyframes mw{0%,100%{height:4px}50%{height:13px}}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--hairline);background:var(--canvas-raised);
  color:var(--ink-subtle);cursor:pointer}
.chip:hover{border-color:rgb(var(--acc-rgb) / .5);color:var(--ink)}
.chip[data-on="1"]{background:rgb(var(--acc-rgb) / .12);border-color:rgb(var(--acc-rgb) / .4);color:color-mix(in srgb,var(--acc) 60%,var(--ink))}

/* ---------- segmented ---------- */
.seg{display:flex;gap:4px;padding:3px;border-radius:var(--radius-inset);border:1px solid var(--hairline);background:var(--canvas-soft)}
.seg button{flex:1;font:inherit;font-size:12.5px;color:var(--ink-muted);padding:6px 12px;border:0;border-radius:6px;
  background:transparent;cursor:pointer}
.seg button[data-on="1"]{color:var(--ink);background:var(--canvas);box-shadow:0 1px 2px rgb(0 0 0 / .06)}
.seg2{position:relative;display:flex;padding:3px;border-radius:999px;background:var(--surface-soft);isolation:isolate}
.seg2 button{position:relative;z-index:1;font:inherit;font-size:12.5px;padding:6px 15px;border:0;background:transparent;
  cursor:pointer;color:var(--ink-muted);transition:color .2s}
.seg2 button[data-on="1"]{color:#fff;font-weight:560}
.seg2 .ind{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:999px;background:var(--acc);
  transition:transform .42s cubic-bezier(.34,1.28,.5,1),width .42s cubic-bezier(.34,1.28,.5,1)}
.seg-mac{display:inline-flex;border:1px solid rgb(0 0 0 / .12);border-radius:7px;overflow:hidden;background:#f2f2f4}
.seg-mac button{font:inherit;font-size:12.5px;padding:5px 14px;border:0;border-right:1px solid rgb(0 0 0 / .1);
  background:transparent;cursor:pointer;color:#1d1d1f}
.seg-mac button:last-child{border-right:0}
.seg-mac button[data-on="1"]{background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .14)}
.seg-tab{display:flex;gap:16px;border-bottom:1px solid var(--hairline);position:relative}
.seg-tab button{font:inherit;font-size:13px;padding:7px 2px;border:0;background:transparent;cursor:pointer;color:var(--ink-muted)}
.seg-tab button[data-on="1"]{color:var(--ink);font-weight:560}
.seg-tab .ind{position:absolute;bottom:-1px;height:2px;background:var(--acc);border-radius:2px;
  transition:transform .34s cubic-bezier(.22,1,.36,1),width .34s cubic-bezier(.22,1,.36,1)}

/* ---------- notch / capsule ---------- */
.cap{background:linear-gradient(180deg,#1b1d23,#101216);border:1px solid rgb(255 255 255 / .08);border-radius:16px;
  color:#eef1f5;padding:9px 15px;display:flex;align-items:center;gap:10px;font-family:var(--font-display);
  box-shadow:0 10px 30px rgb(0 0 0 / .46),inset 0 1px 0 rgb(255 255 255 / .06);font-size:13px;
  transition:width .42s cubic-bezier(.34,1.28,.5,1),border-radius .24s,transform .24s}
.cap-viz{display:flex;align-items:center;gap:3px;height:20px}
.cap-viz i{width:3px;border-radius:999px;height:6px;background:linear-gradient(180deg,
  color-mix(in srgb,rgb(var(--acc-rgb)) 65%,#fff),rgb(var(--acc-rgb)));animation:vz .9s ease-in-out infinite}
.cap-viz i:nth-child(2){animation-delay:.12s}.cap-viz i:nth-child(3){animation-delay:.24s}
.cap-viz i:nth-child(4){animation-delay:.36s}.cap-viz i:nth-child(5){animation-delay:.48s}
@keyframes vz{0%,100%{height:5px}50%{height:17px}}
.cap-glass{background:rgb(28 30 38 / .55);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgb(255 255 255 / .14)}
.cap-pill{border-radius:999px}
.cap-lbl{font-size:12.5px;font-weight:600;color:#eef1f5}

/* ---------- misc demo bits ---------- */
.kbd{font-family:var(--font-mono);font-size:10.5px;padding:2px 5px;border-radius:4px;background:rgb(255 255 255 / .08);
  border:1px solid rgb(255 255 255 / .14);color:rgb(238 241 245 / .8)}
.kbd.lt{background:var(--surface-soft);border-color:var(--hairline);color:var(--ink-muted)}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:13px;height:4px;border-radius:999px;background:rgb(var(--acc-rgb) / .4);transition:width .3s,background .26s}
.dots i[data-s="cur"]{width:20px;background:rgb(var(--acc-rgb));box-shadow:0 0 8px rgb(var(--acc-rgb) / .7)}
.dots i[data-s="fut"]{background:rgb(255 255 255 / .18)}
.dots.lt i[data-s="fut"]{background:rgb(11 13 18 / .12)}
.cube-stage{display:grid;place-items:center;perspective:90px;width:26px;height:26px}
.cube{position:relative;width:16px;height:16px;transform-style:preserve-3d;animation:cspin 2.6s linear infinite}
.cube i{position:absolute;inset:0;border:1px solid rgb(var(--acc-rgb) / .9);background:rgb(var(--acc-rgb) / .14)}
.cube i:nth-child(1){transform:rotateY(0) translateZ(8px)}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(8px)}
.cube i:nth-child(3){transform:rotateY(180deg) translateZ(8px)}.cube i:nth-child(4){transform:rotateY(270deg) translateZ(8px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(8px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(8px)}
@keyframes cspin{to{transform:rotateX(-360deg) rotateY(360deg)}}
.eyes{display:flex;gap:4px;animation:bob 2.6s ease-in-out infinite}
.eyes i{width:5px;height:8px;border-radius:60%;background:rgb(var(--acc-rgb));box-shadow:0 0 6px rgb(var(--acc-rgb) / .7);
  animation:blink 3.4s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.card-mini{background:var(--canvas-raised);border:1px solid var(--hairline);border-radius:10px;padding:12px 14px;
  box-shadow:5px 5px 0 rgb(var(--acc-rgb) / .14);width:100%;max-width:260px}

/* =========================================================================
   Kairo UI/UX library explorer.
   Everything below is a self-contained demo page — it does NOT touch the app.
   Badges: CURRENT = what Kairo ships today (recreated pixel-close);
           MOCK    = faithful recreation of that library's look/behaviour;
           LIVE    = the real library, loaded from a CDN at page load.
   ========================================================================= */

const ACCENTS = ['#665cff','#0ea5e9','#10b981','#f59e0b','#ff6b66','#c05cff'];

/* --- tiny helpers ------------------------------------------------------- */
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const on = (el, sel, ev, fn) => el.querySelectorAll(sel).forEach(n => n.addEventListener(ev, fn));
const toggleAttr = (el) => el.dataset.on = el.dataset.on === '1' ? '0' : '1';
async function tryImport(url){ try { return await import(/* @vite-ignore */ url); } catch (e) { console.warn('cdn miss', url, e); return null; } }
function cssLink(href){ const l = document.createElement('link'); l.rel='stylesheet'; l.href=href; document.head.appendChild(l); }

/* Generic "click anything with data-toggle to flip it" wiring. */
function wireToggles(root){ on(root, '[data-toggle]', 'click', (e) => toggleAttr(e.currentTarget)); }
/* Generic segmented-control wiring: [data-seg] parent, buttons inside. */
function wireSeg(root){
  root.querySelectorAll('[data-seg]').forEach(seg => {
    const ind = seg.querySelector('.ind');
    const move = (btn) => {
      seg.querySelectorAll('button').forEach(b => b.dataset.on = b === btn ? '1' : '0');
      if (ind){ ind.style.width = btn.offsetWidth + 'px'; ind.style.transform = 'translateX(' + (btn.offsetLeft - (seg.querySelector('.ind').parentElement === seg ? 0 : 0)) + 'px)'; }
    };
    seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => move(b)));
    const cur = seg.querySelector('button[data-on="1"]') || seg.querySelector('button');
    requestAnimationFrame(() => move(cur));
  });
}

/* A shared fake "mic level" ticker so every voice demo breathes in sync. */
const micSubs = new Set();
let micT = 0;
(function micLoop(){
  micT += 0.06;
  const lvl = Math.max(0, Math.min(1, (Math.sin(micT) * 0.5 + 0.5) * 0.7 + Math.sin(micT * 3.3) * 0.28 + Math.random() * 0.08));
  micSubs.forEach(fn => fn(lvl));
  requestAnimationFrame(micLoop);
})();
const onMic = (fn) => micSubs.add(fn);

SECTIONS.push({
  id:'audit', kicker:'read this first', title:'What the audit found',
  blurb:'Every UI surface in the desktop app is hand-built: 1,568 lines of styles.css, 758 of onboarding.css, 457 of settings.css, plus per-component CSS-in-markup. That is not automatically wrong — the notch, the pet and the overlay genuinely have no off-the-shelf equivalent. But eleven generic controls are being maintained by hand, and three whole UX affordances are simply missing.',
  audit:[
    {s:'hi', t:'No toast / notification system anywhere', p:'Billing errors, voice-save failures, update results and permission changes all render as inline text that appears in place and never announces itself. A user who is not looking at that section never learns the action failed. This is the single biggest missing primitive — Sonner is a 2-hour install.'},
    {s:'hi', t:'The voice picker is a native &lt;select&gt;', p:'ElevenLabs returns a live catalogue that can run to hundreds of voices. A native select with no search, no grouping, no per-row preview and no gender/language filter is the worst control for that data. Preview also requires selecting first, so auditioning a voice mutates the saved preference.'},
    {s:'hi', t:'Zero tooltips, zero keyboard-shortcut surfacing', p:'The whole product is driven by ⌥⌃ and ⌥⇧P, yet nothing in Settings or the notch teaches or reminds you. No hover hints on the icon buttons, no shortcut legend, no command palette.'},
    {s:'md', t:'Settings is one 404px column that scrolls', p:'Nine sections stacked vertically with no grouping, no search, no icons and no sticky context. macOS System Settings, Linear and Raycast all solved this with a sidebar or grouped inset lists. It will not survive the next five settings.'},
    {s:'md', t:'Focus states are near-absent', p:'Only .annotation-overlay-canvas has a :focus-visible rule. Buttons, swatches, toggles and the modal all lack visible focus rings and the Skills modal has no focus trap, no Escape handler and no scroll lock — it is a div with a click-outside handler.'},
    {s:'md', t:'Loading is always the word "Loading…"', p:'Settings, VoiceSettings and the update row each render bare text. No skeletons, no shimmer, no optimistic state — so every open of Settings flashes an empty card.'},
    {s:'md', t:'Two different animation stacks fight each other', p:'framer-motion drives FrontDoor and the caption stream; hand-written @keyframes drive the capsule, the box draw, the pet, the swatches. The comment in styles.css literally says "disable the CSS entrance so the two do not fight". Pick one owner per surface.'},
    {s:'lo', t:'react-icons pulls whole icon families', p:'Act5Source imports from five different react-icons namespaces (si, fa6, ri, lu). Tree-shaking helps, but a single 1.5kb-per-icon set (lucide) would be smaller, visually consistent and stroke-tunable to match Geist.'},
    {s:'lo', t:'No reduced-transparency / high-contrast handling', p:'prefers-reduced-motion is handled well (genuinely — better than most apps). prefers-contrast and forced-colors are not handled at all, and the notch is pure dark regardless of system appearance.'},
    {s:'lo', t:'Colour maths is done by hand in CSS', p:'color-mix() everywhere is fine, but accent derivation (hover/active/soft/on-dark variants) has no single source. A 2kb colour lib (colord / culori) plus generated scales would make every accent safe against the light card AND the dark notch.'}
  ]
});

    {n:'Magnetic hover (GSAP)', lib:'gsap', tag:'live', inst:'npm i gsap',

    {n:'Voice-first, type second', lib:'design pattern', tag:'mock', inst:'—',

.ok{color:#4a7a08}.bad{color:#9f2d24}

.shim{background:linear-gradient(90deg,rgb(238 241 245/.35) 20%,#fff 50%,rgb(238 241 245/.35) 80%);

  animation:shimmove 1.8s linear infinite;font-size:12.5px;font-weight:560}
@keyframes shimmove{to{background-position:-200% 0}}

.orb{width:34px;height:34px;border-radius:999px;background:radial-gradient(circle at 35% 32%,
  color-mix(in srgb,rgb(var(--acc-rgb)) 90%,#fff),rgb(var(--acc-rgb)) 55%,color-mix(in srgb,rgb(var(--acc-rgb)) 60%,#000) 100%);

@keyframes breathe{0%,100%{transform:scale(.86);opacity:.8}50%{transform:scale(1.08);opacity:1}}

.orbit i:nth-child(2){animation-delay:-.37s;opacity:.6}.orbit i:nth-child(3){animation-delay:-.74s;opacity:.35}

@keyframes blobm{0%,100%{border-radius:60% 40% 55% 45%/50% 55% 45% 50%;transform:rotate(0) scale(1)}

.eq{display:flex;align-items:flex-end;gap:2px;height:26px}

.radial{position:relative;width:34px;height:34px}
.radial i{position:absolute;top:0;left:50%;width:2px;margin-left:-1px;border-radius:2px;background:rgb(var(--acc-rgb));

.siri{width:100%;height:38px;display:block}
.dotmx{display:grid;grid-template-columns:repeat(9,4px);gap:3px}
.dotmx i{width:4px;height:4px;border-radius:999px;background:rgb(var(--acc-rgb)/.25)}
.cap-txt{font-size:12.5px;color:#eef1f5;line-height:1.4}
.wfade span{display:inline-block;animation:wfade .5s both}
@keyframes wfade{from{opacity:0;filter:blur(5px);transform:translateY(4px)}to{opacity:1;filter:blur(0);transform:none}}
.caret{display:inline-block;width:2px;height:1em;background:rgb(var(--acc-rgb));vertical-align:-2px;animation:bl .9s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.kar b{color:rgb(var(--acc-rgb));font-weight:inherit}
`}));

SECTIONS.push({

  today:{ label:'Kairo today — .s-modal-scrim + .s-modal',

    {n:'macOS sheet', lib:'native look', tag:'mock', inst:'CSS only',

SECTIONS.push({
  id:'toast', kicker:'the biggest gap', title:'Toasts & feedback',
  blurb:'There is no notification system. Failures render as inline text: s-action-error in Settings, s-voice-error in the voice picker, an error string in the update row, and a self-dismissing error mode in the notch. Four different mechanisms, none of which can announce anything that happens while the user is looking elsewhere.',
  today:{ label:'Kairo today — inline strings, four separate mechanisms',
    html:`<div class="col" style="width:100%;max-width:250px">
      <div style="padding:9px 11px;border:1px solid color-mix(in srgb,#c83c32 34%,var(--hairline));border-radius:8px;background:color-mix(in srgb,#c83c32 6%,#fff);font-size:12px">
      <b style="display:block">Checkout didn't complete</b><span style="color:var(--ink-muted)">You can try again — you were not charged.</span></div>
      <span style="font-size:12px;color:#9f2d24">Could not load voices. Check your connection.</span></div>`,
    pain:'The billing notice is actually well-designed — keep it. The problem is everything else: <b>a voice save that fails while the modal is closed is silent</b>, an update failure only shows if you look at that row, and nothing at all reports success.'},
  options:[
    {n:'Sonner', lib:'sonner · MIT', tag:'mock', badge:'pick', inst:'npm i sonner',
     html:`<div class="toast-stack"><div class="toast toast-sonner"><span class="ok">✓</span><span>Voice saved · Anushka</span></div>

    {n:'Sonner, dark (notch-matched)', lib:'sonner', tag:'mock', inst:'npm i sonner',

      <div class="toast toast-dark"><span>🎙</span><span>Microphone granted</span></div></div>`,
     why:'Same library, restyled to the capsule\'s palette so toasts read as coming from Kairo rather than from a web page. This is the version I would ship.'},
    {n:'The notch IS the toast', lib:'your own capsule', tag:'mock', badge:'pick', inst:'—',
     demoClass:'desk',
     html:`<div class="col" style="align-items:center;gap:10px"><div class="cap cap-pill"><span class="ok">✓</span><span class="cap-lbl">Voice saved · Anushka</span></div>
      <span class="lbl" style="font-size:11px;color:rgb(238 241 245/.5)">same pill, same place, every time</span></div>`,
     why:'<b>The Kairo-native answer.</b> You already have a persistent, mode-morphing status surface at the top of the screen. Routing app-wide notices through it means one status location in the entire product instead of five. Settings toasts appear where the user already looks for Kairo.'},
    {n:'react-hot-toast', lib:'react-hot-toast · MIT', tag:'mock', inst:'npm i react-hot-toast',

    {n:'Base UI Toast', lib:'@base-ui-components/react', tag:'mock', inst:'npm i @base-ui-components/react',
     html:`<div class="toast toast-sonner" style="border-radius:var(--radius-inset)"><span>ℹ</span><span>Update ready — restart to install</span>
      <button class="b b-ghost" style="margin-left:auto;padding:3px 8px;font-size:11px">Restart</button></div>`,
     why:'If you adopt Base UI for dialogs anyway, its toast keeps you on one overlay/portal system. Action buttons inside toasts matter here — "Update ready → Restart" is exactly your use case.'},

SECTIONS.push({
  id:'capsule', kicker:'the crown jewel', title:'The notch capsule & its morph',
  blurb:'One persistent pill that springs between sizes while content cross-fades: useCapsuleMorph measures an inner max-content box and writes --capsule-w/--capsule-h; useModePresence keeps the leaving layer absolutely positioned so it does not stretch the measurement. This is the most sophisticated thing in the codebase and it is hand-written. The question is not whether to replace it — it is whether a library would make it shorter and less fragile.',
  today:{ label:'Kairo today — measure + CSS custom props + cross-fade layers', dark:true,
    html:`<div class="col" style="align-items:center;gap:10px"><div class="cap cap-pill" data-morph><span class="cap-viz"><i></i><i></i><i></i><i></i><i></i></span><span class="cap-lbl" data-mlbl>Listening…</span></div>
      <span class="lbl" style="font-size:11px;color:rgb(238 241 245/.5)">watch it morph between modes</span></div>`,
    pain:'Works, but: the measurement runs on every mode change, blur+opacity cross-fade costs a filter repaint on every transition, and the comment in NotchCapsule warns that framer-motion and the CSS keyframes must not fight. Two animation systems own one element.',
     init:(el)=>{ const lbl=el.querySelector('[data-mlbl]'); const modes=['Listening…','Thinking…','Speaking…','Ready'];
       let i=0; setInterval(()=>{ lbl.textContent=modes[i++%modes.length]; },1800); } },
  options:[
    {n:'Motion layout animation', lib:'motion', tag:'mock', badge:'pick', inst:'npm i motion',
     demoClass:'desk',
     html:`<div class="col" style="align-items:center;gap:9px">
      <div class="cap cap-pill" data-auto><span class="cap-lbl">Thinking…</span></div>
      <button class="b b-ghost" style="font-size:11.5px;color:#cfd4de;border-color:rgb(255 255 255/.16)" data-swap>swap mode</button></div>`,
     init:(el)=>{ const c=el.querySelector('[data-auto]'), b=el.querySelector('[data-swap]');
       const modes=[ '<span class="cap-lbl">Thinking…</span>',
         '<span class="cap-viz"><i></i><i></i><i></i><i></i><i></i></span><span class="cap-lbl">Listening…</span>',
         '<span class="cap-lbl">Ask about this screen — hold ⌥⌃</span>'];
       let i=0; c.style.transition='width .42s cubic-bezier(.34,1.28,.5,1)';
       b.addEventListener('click',()=>{ const w0=c.offsetWidth; c.innerHTML=modes[++i%modes.length];
         c.style.width='auto'; const w1=c.offsetWidth; c.style.width=w0+'px';
         requestAnimationFrame(()=>{ c.style.width=w1+'px'; }); }); },
     why:'<code>&lt;motion.div layout&gt;</code> does the measure-and-tween for you via FLIP, including children. You would delete useCapsuleMorph entirely (~60 lines) and get interruption-safe transitions — today an interrupted morph snaps.'},
    {n:'View Transitions API', lib:'native browser', tag:'mock', inst:'no dependency',
     demoClass:'desk',
     html:`<div class="cap cap-pill"><span class="cap-lbl">document.startViewTransition()</span></div>`,
     why:'WKWebView supports it. Zero bytes, browser-native crossfade + morph of any DOM change. The catch: less control over the curve, and it serialises with the compositor — for a 420ms spring you probably still want Motion. Worth a spike though.'},
    {n:'GSAP Flip', lib:'gsap/Flip', tag:'mock', inst:'npm i gsap',
     demoClass:'desk',
     html:`<div class="cap cap-pill"><span class="cap-lbl">Flip.from(state)</span></div>`,
     why:'The most powerful FLIP implementation, and GSAP + all plugins went fully free in 2025. Overkill unless you also want it for the overlay drawing; two animation engines is one too many.'},
    {n:'auto-animate', lib:'@formkit/auto-animate', tag:'live', inst:'npm i @formkit/auto-animate',

     why:'One line (<code>autoAnimate(ref)</code>) and every list add/remove/reorder animates. Not for the capsule — for the Skills list, the voice list, the permission list. Click "add a row" here; that is the whole API.'},

SECTIONS.push({
  id:'voice', kicker:'the signature', title:'Voice & mic visualisation',
  blurb:'Three visualisers exist today: five bars in the capsule (height driven by --mic-level), an eight-bar radial meter in MicMeter.tsx, and a halo around the pet. All are fed by the native cursor:level stream, which is the right architecture — no second getUserMedia. The question is purely what shape best represents "I am hearing you".',
  today:{ label:'Kairo today — 5 bars + 8-bar radial', dark:true,
    html:`<div class="row" style="gap:22px"><span class="cap-viz" data-bars><i></i><i></i><i></i><i></i><i></i></span>
      <span class="radial" data-radial>${Array.from({length:8},(_,i)=>'<i style="transform:rotate('+(i*45)+'deg)"></i>').join('')}</span></div>`,
    pain:'Both are good. The weakness is that they look like every other voice UI — bars are the default. For a product whose whole identity is a companion that watches with you, the visualiser is a branding opportunity being spent on a generic equaliser.',
    init:(el)=>{ const bars=[...el.querySelectorAll('[data-bars] i')], rad=[...el.querySelectorAll('[data-radial] i')];
      onMic(l=>{ bars.forEach((b,i)=>b.style.height=(4+l*16*(0.55+((i%3)*0.26)))+'px');
        rad.forEach((r,i)=>r.style.height=(3+l*11*(0.6+((i%4)*0.2)))+'px'); }); } },
  options:[
    {n:'Mirrored waveform', lib:'canvas / CSS', tag:'live', inst:'CSS only', demoClass:'dark',
     html:`<span class="eqm" data-eqm>${Array.from({length:22},()=>'<i></i>').join('')}</span>`,
     init:(el)=>{ const bars=[...el.querySelectorAll('[data-eqm] i')];
       onMic(l=>bars.forEach((b,i)=>{ const w=Math.sin(i*0.6+micT*2)*0.5+0.5;
         b.style.height=(4+l*26*w)+'px'; })); },
     why:'Symmetric around the centre line — reads as a waveform rather than a level meter, which is subtly more "your voice" and less "audio input device". Same data source, ~15 lines.'},
    {n:'Breathing orb', lib:'CSS gradient', tag:'live', inst:'CSS only', demoClass:'dark', badge:'pick',
     html:`<div class="orb" data-orb></div>`,
     init:(el)=>{ const o=el.querySelector('[data-orb]');

     why:'<b>Most on-brand option.</b> An orb that breathes with your voice reads as a presence, not an instrument — which is exactly the "companion, not tool" positioning. Also the cheapest thing on this page to render.'},
    {n:'Siri-style ribbon', lib:'canvas', tag:'live', inst:'~40 lines of canvas', demoClass:'dark',
     html:`<canvas class="siri" data-siri width="480" height="76"></canvas>`,
     init:(el)=>{ const c=el.querySelector('[data-siri]'), x=c.getContext('2d'); let lvl=0;
       onMic(l=>lvl=l);
       (function draw(){ x.clearRect(0,0,c.width,c.height);
         const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();
         for(let k=0;k<3;k++){ x.beginPath();
           for(let i=0;i<=c.width;i+=6){ const t=i/c.width;
             const env=Math.sin(t*Math.PI);
             const y=38+Math.sin(t*7+micT*2.2+k*1.7)*env*lvl*30*(1-k*0.22);
             i?x.lineTo(i,y):x.moveTo(i,y); }
           x.strokeStyle=acc; x.globalAlpha=0.75-k*0.22; x.lineWidth=2.4-k*0.5; x.stroke(); }
         x.globalAlpha=1; requestAnimationFrame(draw); })(); },
     why:'Three phase-shifted sine ribbons enveloped by amplitude. The most "assistant" visual language there is — and unlike bars it survives being stretched to any width, which matters in a morphing pill.'},
    {n:'Ring meter', lib:'CSS conic', tag:'live', inst:'CSS only', demoClass:'dark',

    {n:'Dot matrix', lib:'CSS grid', tag:'live', inst:'CSS only', demoClass:'dark',

     init:async(el)=>{ const m=await tryImport('https://esm.sh/canvas-confetti@1');

  today:{ label:'Kairo today — clip-path draw + dim + ink trace',

  options:[

    {n:'Hand-drawn (rough.js)', lib:'roughjs', tag:'live', inst:'npm i roughjs',
     html:`<div class="screen"><div class="win"></div><div class="btnrow"><span class="fake">File</span><span class="fake tgt">Object</span><span class="fake">Add</span></div>
       <svg data-rough style="position:absolute;inset:0;width:100%;height:100%"></svg></div>`,

       const svg=el.querySelector('[data-rough]'); if(!m) return;
       const rc=m.default.svg(svg); const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();

       svg.appendChild(rc.linearPath([[160,92],[132,68],[128,60]],{stroke:acc,strokeWidth:2,roughness:2.4})); },
     why:'<b>Real library, live.</b> Sketchy circling reads as a teacher marking up your screen, not software drawing a rectangle. Strong brand fit for a tutor — and it makes the annotation feel human rather than surveillance-y.'},
    {n:'perfect-freehand pen', lib:'perfect-freehand', tag:'live', inst:'npm i perfect-freehand',
     html:`<div class="screen"><canvas data-pf style="position:absolute;inset:0;width:100%;height:100%;cursor:crosshair"></canvas>
       <span style="position:absolute;left:10px;bottom:8px;font-size:10px;color:rgb(238 241 245/.5)">draw here →</span></div>`,
     init:async(el)=>{ const m=await tryImport('https://esm.sh/perfect-freehand@1');
       const c=el.querySelector('[data-pf]'); const x=c.getContext('2d');
       const fit=()=>{ c.width=c.offsetWidth*2; c.height=c.offsetHeight*2; x.scale(2,2); }; fit();
       let pts=[], drawing=false;
       const render=()=>{ x.clearRect(0,0,c.width,c.height);
         const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();

       c.addEventListener('pointerdown',(e)=>{ drawing=true; pts=[pos(e)]; render(); });
       c.addEventListener('pointermove',(e)=>{ if(!drawing) return; pts.push(pos(e)); render(); });

         setTimeout(()=>{ pts=[]; render(); },1400); })); },

SECTIONS.push({

  today:{ label:'Kairo today — SVG arrow + spring + trail + FX layers',

  options:[
    {n:'Spring tuning playground', lib:'your spring.ts', tag:'live', inst:'—', badge:'pick',
     html:`<div class="col" style="width:100%;gap:8px"><div class="screen" style="height:96px" data-sp2><div class="win"></div>

       <div class="sl-row"><span>stiffness</span><input class="slider" type="range" min="2" max="30" value="14" data-k /><span data-kv>0.14</span></div>
       <div class="sl-row"><span>damping</span><input class="slider" type="range" min="50" max="95" value="78" data-d /><span data-dv>0.78</span></div></div>`,
     init:(el)=>{ const box=el.querySelector('[data-sp2]'), pet=el.querySelector('[data-pet2]');
       const ks=el.querySelector('[data-k]'), ds=el.querySelector('[data-d]'), kv=el.querySelector('[data-kv]'), dv=el.querySelector('[data-dv]');
       let x=40,y=40,vx=0,vy=0,tx=40,ty=40;

       setInterval(()=>{ if(!box.matches(':hover')){ tx=20+Math.random()*220; ty=18+Math.random()*60; } },1500);
       (function loop(){ const k=+ks.value/100, d=+ds.value/100; kv.textContent=k.toFixed(2); dv.textContent=d.toFixed(2);
         vx=(vx+(tx-x)*k)*d; vy=(vy+(ty-y)*k)*d; x+=vx; y+=vy;

     why:'Not a library — a tuning tool. Drag the sliders: low damping = playful overshoot (feels alive, can look drunk), high stiffness = snappy (feels precise, less charming). Worth spending an hour finding the values that read as "confident but friendly", because this single curve <b>is</b> the personality.'},
    {n:'Rive state machine', lib:'@rive-app/canvas', tag:'mock', inst:'npm i @rive-app/canvas', badge:'pick',

    {n:'Eyes that look at the target', lib:'design pattern', tag:'live', inst:'—', badge:'pick',

    {n:'Squash & stretch', lib:'motion / CSS', tag:'live', inst:'npm i motion',

       <svg class="pet" data-petsq viewBox="0 0 32 32"><path d="M6 3 L28 14 L17 17 L13 28 Z" fill="rgb(var(--acc-rgb))" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg></div>`,

       (function loop(){ vx=(vx+(tx-x)*.16)*.76; vy=(vy+(ty-y)*.16)*.76; x+=vx; y+=vy;
         const sp=Math.min(Math.hypot(vx,vy)/16,.5); const ang=Math.atan2(vy,vx)*180/Math.PI;

    {n:'Trail variants', lib:'CSS / canvas', tag:'live', inst:'—',

SECTIONS.push({
  id:'accent', kicker:'theming', title:'Accent & colour system',
  blurb:'The accent is a first-class product idea: chosen in Act 1, emitted as accent:changed, applied to every WebView, and it tints the pet, the notch, the highlight box and the settings shadow. Eight curated presets replaced the free colour wheel — correct call, since arbitrary hues break contrast on both the light card and the dark pill. What is missing is the derivation layer.',
  today:{ label:'Kairo today — 8 presets + color-mix() by hand',
    html:`<div class="swatchgrid" data-sw>
      ${['#665cff','#0ea5e9','#10b981','#f59e0b','#ff6b66','#c05cff','#14b8a6','#f43f5e'].map((c,i)=>'<button style="background:'+c+'" data-on="'+(i===0?1:0)+'"></button>').join('')}</div>`,
    pain:'Every derived colour is a hand-written color-mix() at the point of use: 62% here, 14% there, 26% somewhere else. There is no single function that answers "what is the hover/active/soft/on-dark version of this accent, and does it pass contrast on both surfaces?"',
    init:(el)=>{ on(el,'button','click',(e)=>{ el.querySelectorAll('button').forEach(b=>b.dataset.on='0');
      e.currentTarget.dataset.on='1'; }); } },
  options:[
    {n:'Generated scales', lib:'@radix-ui/colors + generator', tag:'live', inst:'npm i @radix-ui/colors', badge:'pick',
     html:`<div class="col" style="width:100%;gap:7px"><div class="scale" data-scale></div>
       <span class="lbl" style="font-size:11px">12 steps: backgrounds → borders → solid → text</span></div>`,
     init:(el)=>{ const s=el.querySelector('[data-scale]');
       const paint=()=>{ const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc-rgb').trim();
         s.innerHTML=Array.from({length:9},(_,i)=>'<i style="background:rgb('+acc+' / '+(0.06+i*0.117).toFixed(2)+')"></i>').join(''); };
       paint(); setInterval(paint,600); },
     why:'Radix\'s 12-step model gives every accent a defined role per step (step 3 = subtle bg, 6 = border, 9 = solid, 11 = text). Adopt the <b>model</b> even if not the package: it turns twelve ad-hoc color-mix() calls into one generated set of vars.'},
    {n:'colord / culori', lib:'colord · MIT', tag:'mock', inst:'npm i colord', badge:'pick',
     html:`<div class="col" style="gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)">
       <span>colord(accent).lighten(.1).toHex()</span><span>colord(accent).isReadable(bg)</span>
       <span>colord(accent).alpha(.14).toRgbString()</span></div>`,
     why:'2kb. Gives you programmatic hover/active/soft variants AND a readability check — so a future custom-accent feature can validate a hue against BOTH the light card and the dark pill before allowing it.'},
    {n:'Contrast guard', lib:'colord + your presets', tag:'live', inst:'npm i colord',
     html:`<div class="col" style="gap:7px;width:100%;max-width:230px">
       <div class="row" style="justify-content:space-between"><span style="font-size:12px;color:var(--acc)">accent text on light</span><span class="contrast" data-c1>4.8:1</span></div>
       <div class="row" style="justify-content:space-between;background:#15171d;padding:5px 8px;border-radius:6px">
         <span style="font-size:12px;color:var(--acc)">accent text on notch</span><span class="contrast" data-c2>3.1:1</span></div></div>`,
     init:(el)=>{ const lum=(r,g,b)=>{ const f=v=>{v/=255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
         return .2126*f(r)+.7152*f(g)+.0722*f(b); };

    s.audit.forEach((a,i) => list.appendChild(h(
      '<div class="aud"><span class="n">' + String(i+1).padStart(2,'0') + '</span>' +
      '<div><h4>' + a.t + '</h4><p>' + a.p + '</p></div>' +
      '<span class="sev ' + a.s + '">' + (a.s === 'hi' ? 'high' : a.s === 'md' ? 'medium' : 'low') + '</span></div>')));
    sec.appendChild(list);
  }

  if (s.today){
    const t = h('<div class="today"><div class="demo" style="margin:0"></div>' +
      '<div class="t-meta"><h4><span class="badge cur">current</span> ' + s.today.label + '</h4>' +
      '<p class="t-pain">' + s.today.pain + '</p></div></div>');
    const d = t.querySelector('.demo');
    d.innerHTML = s.today.html;
    if (s.today.dark) d.classList.add('dark');
    sec.appendChild(t);
    wireToggles(d); wireSeg(d);
    if (s.today.init) { try { s.today.init(d); } catch(e){ console.warn('today init failed', s.id, e); } }
  }

  if (s.note) sec.appendChild(h('<div class="note">' + s.note + '</div>'));

  if (s.plan){
    const list = h('<div class="plan"></div>');
    s.plan.forEach(p => list.appendChild(h(
      '<div class="p"><span class="num">' + p.n + '</span>' +
      '<div><b>' + p.t + '</b><p>' + p.p + '</p></div>' +
      '<span class="eff">' + p.e + '</span></div>')));
    sec.appendChild(list);
  }

  if (s.options){
    const grid = h('<div class="grid"></div>');
    s.options.forEach(o => {
      const card = h('<div class="opt" data-search="' + (o.n + ' ' + o.lib).toLowerCase() + '"></div>');
      const badge = o.badge ? '<span class="badge ' + o.badge + '">' + o.badge + '</span>' : '';
      const tag = '<span class="badge ' + o.tag + '" data-tagslot>' + o.tag + '</span>';
      card.appendChild(h('<div class="opt-h"><h4>' + o.n + '</h4>' + (badge || tag) + '</div>'));
      if (badge) card.querySelector('.opt-h').insertAdjacentHTML('beforeend', tag);
      card.appendChild(h('<div class="lib">' + o.lib + '</div>'));
      const demo = h('<div class="demo ' + (o.demoClass || '') + '"></div>');
      demo.innerHTML = o.html;
      card.appendChild(demo);
      card.appendChild(h('<div class="why">' + o.why + '</div>'));
      if (o.inst && o.inst !== '—') card.appendChild(h('<div class="inst">' + o.inst + '</div>'));
      grid.appendChild(card);
      wireToggles(demo); wireSeg(demo);
      if (o.init) { try { o.init(demo); } catch(e){ console.warn('init failed', o.n, e); } }
    });
    sec.appendChild(grid);
  }
  app.appendChild(sec);
  toc.appendChild(h('<a href="#' + s.id + '">' + s.title + '</a>'));
}

SECTIONS.forEach(renderSection);

/* copy-to-clipboard on install lines */
document.addEventListener('click', (e) => {
  const i = e.target.closest('.inst'); if (!i) return;
  navigator.clipboard?.writeText(i.textContent.trim());
  i.classList.add('copied'); setTimeout(() => i.classList.remove('copied'), 900);
});

/* accent switcher */
const dots = document.getElementById('accDots');
ACCENTS.forEach((hex,i) => {
  const b = h('<button class="acc-dot" style="background:' + hex + '" data-on="' + (i===0?1:0) + '"></button>');
  b.addEventListener('click', () => {
    document.documentElement.style.setProperty('--acc', hex);
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), bl = parseInt(hex.slice(5,7),16);
    document.documentElement.style.setProperty('--acc-rgb', r + ' ' + g + ' ' + bl);
    dots.querySelectorAll('.acc-dot').forEach(d => d.dataset.on = '0'); b.dataset.on = '1';
  });
  dots.appendChild(b);
});

/* filter */
document.getElementById('srch').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.opt').forEach(o => o.classList.toggle('hidden', q && !o.dataset.search.includes(q)));
  document.querySelectorAll('.sec').forEach(s => {
    const g = s.querySelector('.grid'); if (!g) return;
    s.classList.toggle('hidden', q && ![...g.children].some(c => !c.classList.contains('hidden')));
  });
});

/* toc active state */
const io = new IntersectionObserver((entries) => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    toc.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id));
  });
}, { rootMargin: '-70px 0px -70% 0px' });
document.querySelectorAll('.sec').forEach(s => io.observe(s));
</script>
</body>
